<!DOCTYPE html>
<html lang="en">
<head>
    script async src="https://www.googletagmanager.com/gtag/js?id=G-RTVXM4ZRD1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-RTVXM4ZRD1');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Snapshots</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        /* Back Button */
        .back-button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 30px;
            transition: 0.3s;
        }

        .back-button:hover {
            background-color: #0056b3;
            transform: translateX(-3px);
        }

        /* Snapshot Container */
        .snapshot-container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .snapshot {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 12px;
            overflow: hidden;
        }

        .snapshot img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Full width screenshots */
        .wide {
            grid-column: 1 / -1;
        }

        /* Mobile */
        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .back-button {
                margin-bottom: 20px;
            }

            .snapshot-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .wide {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Back to Portfolio -->
    <a href="index.html" class="back-button">← Back</a>

    <div class="snapshot-container">

        <!-- Home Page -->
        <div class="snapshot wide">
            <img src="IMAGES/Capstone Home Page.png" alt="H2O Express Home Page">
        </div>

        <!-- Categories -->
        <div class="snapshot">
            <img src="IMAGES/option.png" alt="Service Categories">
        </div>

        <!-- Profile -->
        <div class="snapshot">
            <img src="IMAGES/Registration.png" alt="Profile Information">
        </div>

        <!-- Water Service -->
        <div class="snapshot wide">
            <img src="IMAGES/Water Service.png" alt="Water Service">
        </div>

    </div>

</body>

</html>
